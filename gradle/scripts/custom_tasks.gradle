apply from: 'gradle/scripts/helpers.gradle'

public void fnGenerateMixinJson() {
    def missingConfig = propertyStringList('mixin_configs').findAll(config -> !file("src/main/resources/${config}.json").exists())
    if (!propertyBool('use_mixin') || !propertyBool('generate_mixins_json') || missingConfig.empty) {
        return
    }
    def lines = """{
    "package": "",
    "required": true,
    "target": "@env(DEFAULT)",
    "minVersion": "0.8",
    "compatibilityLevel": "JAVA_8",
    "mixins": [],
    "server": [],
    "client": [],
    "injectors": {
        "defaultRequire": 1
    }
}
"""
    for (String mixinConfig : missingConfig) {
        file("src/main/resources/${mixinConfig}.json") << lines
    }
}

tasks.register('generateMixinJson') {
    group = 'custom helpers'
    doLast {
        fnGenerateMixinJson()
    }
}

public void fnGenerateAccessWidenerBase() {
    File f = file("src/main/resources/${propertyString('access_widener_name')}.accesswidener")
    if (!propertyBool('use_access_widener') || !propertyBool('generate_access_widener') || f.exists()) {
        return
    }
    def lines = """accessWidener v2 named
# Access Widener file generated by ModTemplatez
# If `use_access_widener` is not `true` or `access_widener_name` is not the file name of this file,
# this Access Widener file will not be used and can be deleted, see `gradle.properties` for more info

"""
    f << lines
}

tasks.register('generateAccessWidenerBase') {
    group = 'custom helpers'
    doLast {
        fnGenerateAccessWidenerBase()
    }
}

ext.fnGenerateAccessWidenerBase = this.&fnGenerateAccessWidenerBase
ext.fnGenerateMixinJson = this.&fnGenerateMixinJson

// =============================================================================
// genIntellijRuns - 生成 IntelliJ IDEA 运行配置（照搬 loom 项目自身机制）
//
// 数据源:
//   1. Loom 全局缓存: ~/.gradle/caches/fabric-loom/<mc>/forge/<forge-version>/
//      - forge-config.json   ← Loom 解压 forge-userdev.jar 后产出，含每个 run 的
//                              main / args / jvmArgs / env 描述（占位符未展开）
//      - launch.cfg          ← gradle runClient 时 loom 展开后的真实 launcher 配置
//                              含 assetIndex / assetsDir / legacyClassPath 等具体值
//   2. .gradle/loom-cache/forge_minecraft_classpath.txt
//      → 用于在 jvmArgs 里替换 {modules} 占位符为 8 个 module jar 路径
//
// 主类: net.fabricmc.devlaunchinjector.Main（loom RunConfig.runConfig() 的 devLaunchMainClass）
// VM args 在 jvmArgs 之前先加：
//   -Dfabric.dli.config=<launch.cfg 绝对路径（enEscape 处理空格）>
//   -Dfabric.dli.env=<client|server>
// VM args 再追加 forge-config.json 的 jvmArgs（{modules} → 8 个 jar 等），
// 末尾加上 -Dfabric.dli.main=<runConfig.main> 让 devlaunchinjector 委托给 BootstrapLauncher。
//
// 不会动 IML：mod jar 走 IDEA module library classpath，由 Minecraft Plugin 维护；
// 不装插件则手动在 IML 加 orderEntry。
// =============================================================================

import java.util.regex.Matcher
import org.gradle.api.GradleException
import groovy.json.JsonSlurper

private static String fnXmlEscape(String s) {
    if (s == null) return ''
    s.toString()
        .replace('&', '&amp;')
        .replace('<', '&lt;')
        .replace('>', '&gt;')
        .replace('"', '&quot;')
}

/**
 * 复刻 loom RunConfig.encodeEscaped():
 * 空格 → @@0020；非开头处的 '@' → @@0040（@ 前不是 @ 则转义）
 * @ 后的两个 hex 必须 lowercase（format args: Locale.ENGLISH, @@%04x）
 */
private static String fnEncodeEscaped(String s) {
    if (s == null) return ''
    StringBuilder out = new StringBuilder()
    int n = s.length()
    for (int i = 0; i < n; i++) {
        char c = s.charAt(i)
        boolean escape = false
        if (c == (char) 0x20) {
            escape = true
        } else if (c == '@' && i > 0 && s.charAt(i - 1) != '@') {
            escape = true
        }
        if (escape) {
            out.append(String.format(Locale.ENGLISH, '@@%04x', (int) c))
        } else {
            out.append(c)
        }
    }
    return out.toString()
}

/** 从 forge_minecraft_classpath.txt 里过滤出 Loom 认定为模块路径的 jar（forge-config.json modules 字段列名）。 */
private static List<File> fnResolveModulePathJars(File classpathFile, List<String> moduleCoords) {
    List<File> hits = []
    classpathFile.eachLine { rawLine ->
        def line = rawLine?.trim()
        if (!line) return
        def basename = new File(line).name
        moduleCoords.each { mod ->
            def parts = mod.split(':')
            def artifact = parts.length >= 2 ? parts[1] : parts[0]
            if (basename.startsWith(artifact + '-') && basename.endsWith('.jar')) {
                if (!hits.any { it.absolutePath == new File(line).absolutePath }) {
                    hits << new File(line)
                }
            }
        }
    }
    return hits
}

/**
 * 从 Loom 产出的 launch.cfg 文本里读出 `--assetIndex <v>` / `--assetsDir <p>`。
 * 对应 args 中 {asset_index} / {assets_root} 的具体值。
 */
private static List<String> fnReadLaunchCfgArgs(File launchCfg) {
    if (!launchCfg.exists()) return [null, null]
    String text = launchCfg.text
    int idx = text.indexOf('clientArgs')
    if (idx < 0) return [null, null]
    int end = text.indexOf('\nclientProperties', idx)
    if (end < 0) end = text.length()
    String block = text.substring(idx, end)

    String assetIndex = null
    String assetsDir = null
    Matcher ami = (block =~ /--assetIndex\s*\r?\n([^\r\n]+)/)
    if (ami.find()) assetIndex = ami.group(1).trim()
    Matcher amd = (block =~ /--assetsDir\s*\r?\n([^\r\n]+)/)
    if (amd.find()) assetsDir = amd.group(1).trim()
    return [assetIndex, assetsDir]
}

/**
 * 把 args / jvmArgs 中仍残留的 {asset_index} / {assets_root} 替换成 launch.cfg 里的具体值。
 */
private static String fnResolvePlaceholders(String arg, String assetIndex, String assetsDir) {
    String out = arg
    if (assetIndex != null) {
        out = out.replace('{asset_index}', assetIndex)
                  .replace('{assetIndex}', assetIndex)
    }
    if (assetsDir != null) {
        out = out.replace('{assets_root}', assetsDir)
                  .replace('{assetsDir}', assetsDir)
    }
    return out
}

/**
 * 从 build.gradle 文本里读出 runs { <runName> { ...} } 中的 programArgs / vmArgs 字面量数组。
 * 用大括号配对法找 runs 顶层块 + runName 子块，再按行扫描，
 * 遇到 programArgs / vmArgs 字段就把该行（以及下续字符串行）的 "..." 全部收进对应列表。
 * 避免依赖 Groovy AST（外部脚本读 build.gradle 太重）。
 */
private static Map<String, List<String>> fnReadBuildGradleRunArgs(File buildFile, String runName) {
    Map<String, List<String>> result = [programArgs: [], vmArgs: []]
    if (buildFile == null || !buildFile.exists()) return result
    String text = buildFile.text

    // 1. 找到 runs { ... } 顶层块（可能有多个同名块，但典型只有一个）
    List<List<Integer>> runsBlocks = []
    int i = 0
    while (i < text.length() - 5) {
        if (text.regionMatches(i, 'runs', 0, 4)
                && (i == 0 || !Character.isLetterOrDigit(text.charAt(i - 1)))
                && (i + 4 < text.length() && Character.isWhitespace(text.charAt(i + 4)))) {
            int j = i + 4
            while (j < text.length() && Character.isWhitespace(text.charAt(j))) j++
            if (j < text.length() && text.charAt(j) == '{') {
                int depth = 0
                int k = j
                int endIdx = -1
                while (k < text.length()) {
                    char c = text.charAt(k)
                    if (c == '{') depth++
                    else if (c == '}') {
                        depth--
                        if (depth == 0) { endIdx = k; break }
                    }
                    k++
                }
                if (endIdx > 0) {
                    runsBlocks << [j, endIdx]
                    i = endIdx + 1
                    continue
                }
            }
        }
        i++
    }

    // 2. 在每个 runs 块里找 <runName> { ... } 子块
    for (List block : runsBlocks) {
        String rb = text.substring((int) block[0], (int) block[1] + 1)
        int rnIdx = -1
        for (int p = 0; p < rb.length() - 1; p++) {
            if (rb.charAt(p) == '\n') {
                int q = p + 1
                while (q < rb.length() && Character.isWhitespace(rb.charAt(q))) q++
                int qEnd = q
                while (qEnd < rb.length() && (Character.isLetterOrDigit(rb.charAt(qEnd)) || rb.charAt(qEnd) == '_')) qEnd++
                if (qEnd > q && rb.substring(q, qEnd) == runName) {
                    int r = qEnd
                    while (r < rb.length() && Character.isWhitespace(rb.charAt(r))) r++
                    if (r < rb.length() && rb.charAt(r) == '{') {
                        rnIdx = r
                        break
                    }
                }
            }
        }
        if (rnIdx < 0) continue

        int depth = 0
        int subEnd = -1
        for (int k = rnIdx; k < rb.length(); k++) {
            char c = rb.charAt(k)
            if (c == '{') depth++
            else if (c == '}') {
                depth--
                if (depth == 0) { subEnd = k; break }
            }
        }
        if (subEnd < 0) continue
        String subBlock = rb.substring(rnIdx, subEnd + 1)

        // 3. 按行扫描，每行识别字段名并收集 "..."
        String currentField = null
        for (String line : subBlock.split('\n')) {
            // 跳过纯注释、纯空白
            if (line.trim().isEmpty() || line.trim().startsWith('//')) continue
            // 行去掉前导空白 + 头部如果以非空白字符串开始，且能被解析为 fieldName + 后续内容
            String trimmed = line.trim()
            def fm = (trimmed =~ /^([a-zA-Z_][a-zA-Z_0-9]*)\s*(.*)$/)
            if (fm.matches()) {
                String fname = fm.group(1)
                String rest = fm.group(2)
                if (fname == 'programArgs' || fname == 'vmArgs') {
                    currentField = fname
                    fnCollectStrings(rest, result[fname])
                    continue
                } else {
                    // 别的字段（如 client()、name、runDir、propertyString 等），停止收集
                    currentField = null
                    continue
                }
            } else {
                // 行不以 [a-zA-Z_] 开头，可能是字符串续行（罕见）
                if (currentField != null) {
                    fnCollectStrings(line, result[currentField])
                }
            }
        }
        return result
    }
    return result
}

/** 从一行文本里提取所有 "..." 转义字符串（含 `\"` / `\\`），写进 out。 */
private static void fnCollectStrings(String text, List<String> out) {
    def matcher = (text =~ /"((?:[^"\\]|\\.)*)"/)
    while (matcher.find()) {
        String s = matcher.group(1)
        s = s.replace('\\"', '"').replace('\\\\', '\\')
        out << s
    }
}

/** 把 Groovy 字符串里对 Gradle property 的引用替换成实际值。\n * 当前支持：${propertyString('xxx')} → gradle.properties 中 xxx 的值。\n * 不认识的形式原样保留，避免误改。\n */
private static String fnSubstituteGroovyProps(String s, org.gradle.api.Project project) {
    if (s == null) return ''
    return s.replaceAll(/\$\{propertyString\('([^']+)'\)\}/) { match ->
        String key = match[1]
        def v = project.findProperty(key)
        return v != null ? v.toString() : match[0]
    }
}

/**
 * 写单个 IntelliJ Application run config（devlaunchinjector + BootstrapLauncher）。
 */
private File fnWriteIntelliJRunConfig(
        String runName,
        Map runJson,
        String modulePathStr,
        String moduleName,
        File buildFile,
        File launchCfg,
        String assetIndex,
        String assetsDir) {
    def outFile = file(".idea/runConfigurations/${runName}.xml")
    outFile.parentFile.mkdirs()

    // 主类（loom RunConfig.runConfig 用 devLaunchMainClass；即 net.fabricmc.devlaunchinjector.Main）
    String devLaunchMainClass = 'net.fabricmc.devlaunchinjector.Main'

    // 程序实参：build.gradle 里 runs.<runName>.programArgs (含字面插值替换)
    // 同时校验：devlaunchinjector 把这些 args 追加到 launch.cfg clientArgs 后面传给 BootstrapLauncher，
    // 用户若误塞 --launchTarget / --gameDir 等与 launch.cfg 重复的 token 会触发 joptsimple MultipleArgumentsForOptionException。
    def buildRunArgs = fnReadBuildGradleRunArgs(buildFile, runName)
    List<String> buildProgramArgs = buildRunArgs.programArgs.collect { fnSubstituteGroovyProps(it, project) }
    List<String> buildVmArgs = buildRunArgs.vmArgs.collect { fnSubstituteGroovyProps(it, project) }
    // 警告：buildProgramArgs 含 looom clientArgs 已有的 token
    Set<String> LOOM_RESERVED = ['--launchTarget', '--version', '--assetIndex', '--assetsDir',
                                  '--gameDir', '--fml.forgeVersion', '--fml.mcVersion',
                                  '--fml.forgeGroup', '--fml.mcpVersion', '-mixin.config'] as Set
    buildProgramArgs.each { arg ->
        if (LOOM_RESERVED.contains(arg)) {
            project.logger.warn("[genIntellijRuns] runs.${runName}.programArgs 里的 ${arg} 与 launch.cfg clientArgs 重复，" +
                    "会在 IntelliJ 点 ▶ 时触发 joptsimple MultipleArgumentsForOptionException。请从 build.gradle 移除。")
        }
    }
    String programArgs = buildProgramArgs.join(' ')

    // jvmArgs 由 5 部分拼接：
    //  (1) -Dfabric.dli.config=<encodeEscaped(launch.cfg)>
    //  (2) -Dfabric.dli.env=<env>
    //  (3) forge-config.json 的 jvmArgs（{modules} 替换成 8 个 jar 路径；其它占位符替换）
    //  (4) build.gradle 中 runs.<env>.vmArgs（用户配置，如 -Dneoforge.enabledGameTestNamespace 等）
    //  (5) -Dfabric.dli.main=<forge-config.json client.main 即 BootstrapLauncher>
    List<String> vmList = []
    vmList << '-Dfabric.dli.config=' + fnEncodeEscaped(launchCfg.absolutePath)
    vmList << '-Dfabric.dli.env=' + runName
    List rawJvm = (runJson.jvmArgs ?: []) as List
    rawJvm.each { jvmArg ->
        String resolved = fnResolvePlaceholders(jvmArg.toString(), assetIndex, assetsDir)
        resolved = resolved.replace('{modules}', modulePathStr)
        vmList << resolved
    }
    // 追加 build.gradle 的 vmArgs。-D 重复时新值覆盖旧值，没问题。
    vmList.addAll(buildVmArgs)
    String bootstrapLauncher = (runJson.main ?: 'cpw.mods.bootstraplauncher.BootstrapLauncher').toString()
    vmList << '-Dfabric.dli.main=' + bootstrapLauncher
    String vmArgs = vmList.join(' ')

    // env：{source_roots} / {mcp_mappings} 按 loom launch.cfg 实际编码展开
    StringBuilder envs = new StringBuilder()
    Map envMap = runJson.env as Map
    if (envMap != null) {
        envMap.each { key, value ->
            String val = value.toString()
            if (val.contains('{source_roots}')) {
                val = 'main%%$PROJECT_DIR$/build/resources/main;' +
                      'main%%$PROJECT_DIR$/build/classes/java/main;' +
                      'main%%$PROJECT_DIR$/out/production/classes;' +
                      'main%%$PROJECT_DIR$/out/production/resources'
            }
            if (val.contains('{mcp_mappings}')) {
                val = 'loom.stub'
            }
            envs.append('      <env name="').append(fnXmlEscape(key.toString())).append('" value="').append(fnXmlEscape(val)).append('"/>\n')
        }
    }

    // 路径：跟 loom 自家 genEclipseRuns 写出来的 .launch 一致——直接 /run（不分子目录）。
    // launch.cfg 里 clientArgs 的 --gameDir 已经默认指向 loom { runs {} } 配置的 runDir，
    // IntelliJ 这里只用作 devlaunchinjector 工作目录，跟 BootstrapLauncher 实际启动目录是同一份。
    String runDir = 'run'

    def xml = '''<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<component name="ProjectRunConfigurationManager">
  <configuration default="false" factoryName="Application" name="''' + fnXmlEscape(runName) + '''" type="Application" singleton="false">
    <option name="MAIN_CLASS_NAME" value="''' + fnXmlEscape(devLaunchMainClass) + '''"/>
    <option name="PROGRAM_PARAMETERS" value="''' + fnXmlEscape(programArgs) + '''"/>
    <option name="VM_PARAMETERS" value="''' + fnXmlEscape(vmArgs) + '''"/>
    <option name="WORKING_DIRECTORY" value="$PROJECT_DIR$/''' + fnXmlEscape(runDir) + '''/"/>
    <module name="''' + fnXmlEscape(moduleName) + '''"/>
    <envs>
''' + envs.toString() + '''    </envs>
    <method v="2">
      <option enabled="true" name="Make"/>
    </method>
  </configuration>
</component>
'''
    outFile.text = xml
    return outFile
}

public void fnWriteIntellijRunConfigs() {
    // ----- 1. 拿 loom 扩展 + forge 缓存目录 -----
    Object loomExt = project.extensions.findByName('loom')
    if (loomExt == null) {
        throw new GradleException(
            "[genIntellijRuns] 找不到 loom extension。请确认 build.gradle 应用了 dev.architectury.loom。"
        )
    }
    Object forgeProvider = loomExt.forgeProvider
    if (forgeProvider == null) {
        throw new GradleException("[genIntellijRuns] forgeProvider 不存在，可能 Minecraft/Forge 版本尚未配置。")
    }
    File globalCache = forgeProvider.globalCache as File
    if (globalCache == null) {
        throw new GradleException("[genIntellijRuns] forgeProvider.globalCache 为空。")
    }
    File forgeConfigFile = new File(globalCache, 'forge-config.json')

    if (!forgeConfigFile.exists()) {
        throw new GradleException(
            "[genIntellijRuns] 未找到 ${forgeConfigFile}。\n" +
            "请先运行一次 `gradlew runClient`，Loom 解压 forge-userdev.jar 后会自动产出 forge-config.json，" +
            "再次跑 `gradlew genIntellijRuns` 即可。"
        )
    }

    // ----- 2. 解析 forge-config.json -----
    def installerJson = new JsonSlurper().parse(forgeConfigFile)
    def runs = installerJson.runs
    if (runs == null || runs.isEmpty()) {
        throw new GradleException("[genIntellijRuns] forge-config.json 中没有 runs 定义。")
    }
    def modulesArr = installerJson.modules
    if (modulesArr == null || modulesArr.isEmpty()) {
        throw new GradleException("[genIntellijRuns] forge-config.json 中没有 modules 字段。")
    }
    List<String> moduleCoords = new ArrayList<>(modulesArr)

    // ----- 3. 筛出 -p 路径上要用的 jar -----
    File classpathFile = file('.gradle/loom-cache/forge_minecraft_classpath.txt')
    if (!classpathFile.exists()) {
        throw new GradleException(
            "[genIntellijRuns] 找不到 ${classpathFile}。\n" +
            "请先运行一次 `gradlew runClient`，Loom 会产出该文件。"
        )
    }
    List<File> moduleJars = fnResolveModulePathJars(classpathFile, moduleCoords)
    if (moduleJars.empty) {
        throw new GradleException(
            "[genIntellijRuns] 没从 ${classpathFile} 中找到任何 module jar（期望: ${moduleCoords}）。\n" +
            "若 Loom 升级后改了 jar 命名，请同步更新 fnResolveModulePathJars() 的匹配逻辑。"
        )
    }
    String modulePathStr = moduleJars.collect { it.absolutePath }.join(';')

    // ----- 4. 读 launch.cfg 拿 assetIndex / assetsDir -----
    File launchCfg = file('.gradle/loom-cache/launch.cfg')
    def (assetIndex, assetsDir) = fnReadLaunchCfgArgs(launchCfg)
    if (assetIndex == null || assetsDir == null) {
        project.logger.warn(
            "[genIntellijRuns] 没从 ${launchCfg} 读到 assetIndex/assetsDir，" +
            "可能还没跑过 runClient；args 里的 {asset_index} {assets_root} 会保留为占位符。"
        )
    }

    // ----- 5. 写出每份 config -----
    String moduleName = "${rootProject.name}.main"
    File buildFile = rootProject.file('build.gradle')

    Set<String> wantedEnvs = ['client', 'server'] as Set

    runs.each { envName, runJson ->
        if (!wantedEnvs.contains(envName)) return
        def outFile = fnWriteIntelliJRunConfig(envName, runJson as Map, modulePathStr, moduleName, buildFile, launchCfg, assetIndex, assetsDir)
        project.logger.lifecycle("[genIntellijRuns] -> ${outFile}")
    }
}

tasks.register('genIntellijRuns') {
    group = 'ide'
    description = '基于 Loom 内置的 forge-config.json 生成 IntelliJ 运行配置（Client / Server，走 devlaunchinjector）'
    doLast {
        fnWriteIntellijRunConfigs()
    }
}

ext.fnWriteIntellijRunConfigs = this.&fnWriteIntellijRunConfigs
